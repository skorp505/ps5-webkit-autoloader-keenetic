name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: syntax check
        run: |
          bash -n install.sh
          sh -n router/S50relapse-nginx
          sh -n router/send-payload.sh
          node --input-type=module --check < router/relapse-payloads.js
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh
          shellcheck -S warning router/S50relapse-nginx router/send-payload.sh
      - name: markdown lint
        run: |
          npx --yes markdownlint-cli --config .markdownlint.json \
            README.md docs/*.md payloads/README.md